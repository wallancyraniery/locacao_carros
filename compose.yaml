services:
  database:
    image: postgres:17-alpine
    container_name: locacaocarros_database
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB deve ser definida}
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER deve ser definida}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD deve ser definida}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:?POSTGRES_PORT deve ser definida}:5432"
    volumes:
      - database_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  database_data:
    name: locacaocarros_database_data
